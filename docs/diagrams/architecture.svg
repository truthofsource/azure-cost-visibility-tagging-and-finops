<text x="792.0" y="714" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Ownership review</text>
<text x="792.0" y="742" text-anchor="middle" font-size="14" fill="#40556b">Checks ownership labels before anyone</text>
<text x="792.0" y="760" text-anchor="middle" font-size="14" fill="#40556b">changes a resource.</text>
